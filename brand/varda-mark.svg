<svg xmlns="http://www.w3.org/2000/svg" viewBox="17 8 66 85" width="264" height="340" role="img" aria-label="Varda">
  <!-- The pin on its own, the cairn's stones cut out so whatever is behind shows through: for use
       next to the wordmark, on maps or on photos. Change the fill to recolour it. -->
  <defs>
    <mask id="varda-stones">
      <rect x="0" y="0" width="100" height="100" fill="#fff"/>
      <ellipse cx="50" cy="53" rx="16" ry="5.5" fill="#000"/>
      <ellipse cx="49" cy="40.5" rx="11.5" ry="5" fill="#000" transform="rotate(-4 49 40.5)"/>
      <ellipse cx="50.5" cy="29" rx="7" ry="4" fill="#000"/>
    </mask>
  </defs>
  <path d="M50 8 C 30 8 17 23 17 40 C 17 63 50 93 50 93 C 50 93 83 63 83 40 C 83 23 70 8 50 8 Z" fill="#3d6b50" mask="url(#varda-stones)"/>
</svg>
