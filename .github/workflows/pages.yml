name: Deploy web app to GitHub Pages
# Deploys the app (main, at /garmin-maps/app/) and the development version (the dev branch, at
# /garmin-maps/app-dev/) together: Pages publishes one site, so every deploy builds both. Always
# runs from main (only main may deploy to Pages); a push to dev starts it through dev.yml.
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      # Golden and real-data tests skip themselves when the (non-committed) map data is absent.
      - run: npm run typecheck
        working-directory: web
      - run: npm test
        working-directory: web
      - run: npm run build
        working-directory: web
      # The development version: the dev branch, when there is one, tested the same way and built
      # with VITE_CHANNEL=dev (its own storage and caches; see web/src/channel.ts).
      - id: dev
        run: |
          if git ls-remote --exit-code --heads origin dev > /dev/null; then echo "exists=true" >> "$GITHUB_OUTPUT"; fi
      - if: steps.dev.outputs.exists == 'true'
        uses: actions/checkout@v4
        with:
          ref: dev
          path: dev-src
      - if: steps.dev.outputs.exists == 'true'
        working-directory: dev-src/web
        run: |
          npm ci
          npm run typecheck
          npm test
          # Stamped with the dev branch's own commit (GITHUB_SHA is main's here).
          GITHUB_SHA=$(git rev-parse HEAD) VITE_CHANNEL=dev npm run build
          test -d dist/app-dev || { echo "The dev branch has no development-version build (merge main into it)."; exit 1; }
          cp -r dist/app-dev "$GITHUB_WORKSPACE/web/dist/app-dev"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
