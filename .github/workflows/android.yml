# Builds the Android app (android/: the web app in a full-screen WebView, for car head units) and
# publishes it as a GitHub release: GarminMap.apk (the app) and GarminMapDev.apk (the development
# version), always at https://github.com/atlipall/garmin-maps/releases/latest/download/GarminMap.apk.
# Signed with the same key every time (secrets ANDROID_KEYSTORE, base64 of a PKCS12 file, and
# ANDROID_KEYSTORE_PASSWORD), so a new version installs over the old one and keeps its data.
name: Android app
on:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - name: Signing key
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
        run: |
          test -n "$KEYSTORE" || { echo "The ANDROID_KEYSTORE secret is missing."; exit 1; }
          echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/release.p12"
          echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/release.p12" >> "$GITHUB_ENV"
      - name: Build
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: 1.${{ github.run_number }}
        run: gradle --no-daemon assembleLiveRelease assembleDevRelease
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/live/release/app-live-release.apk GarminMap.apk
          cp android/app/build/outputs/apk/dev/release/app-dev-release.apk GarminMapDev.apk
          gh release create "android-1.${{ github.run_number }}" GarminMap.apk GarminMapDev.apk \
            --title "Android app 1.${{ github.run_number }}" \
            --notes "Garmin Map for Android head units: GarminMap.apk loads the app, GarminMapDev.apk the development version (both can be installed). Built from ${GITHUB_SHA::7}."
