# Builds the Android app (android/: the web app in a full-screen WebView, for car head units) and
# publishes it as a GitHub release: Varda.apk (the app) and VardaDev.apk (the development
# version), always at https://github.com/atlipall/varda/releases/latest/download/Varda.apk.
# Signed with the same key every time (secrets ANDROID_KEYSTORE, base64 of a PKCS12 file, and
# ANDROID_KEYSTORE_PASSWORD), so a new version installs over the old one and keeps its data.
name: Android app
on:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - name: Signing key
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
        run: |
          test -n "$KEYSTORE" || { echo "The ANDROID_KEYSTORE secret is missing."; exit 1; }
          echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/release.p12"
          echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/release.p12" >> "$GITHUB_ENV"
      - name: Build
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: 1.${{ github.run_number }}
        run: gradle --no-daemon assembleLiveRelease assembleDevRelease
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Plain names for the "latest" links, and with the version so a downloads folder tells them apart.
          V=1.${{ github.run_number }}
          cp android/app/build/outputs/apk/live/release/app-live-release.apk Varda.apk
          cp android/app/build/outputs/apk/dev/release/app-dev-release.apk VardaDev.apk
          cp Varda.apk "Varda-$V.apk"
          cp VardaDev.apk "VardaDev-$V.apk"
          # A build of another branch (run by hand) is a pre-release: the "latest" links stay on main's.
          PRE=""; [ "${{ github.ref_name }}" = main ] || PRE="--prerelease"
          gh release create "android-$V" Varda.apk VardaDev.apk "Varda-$V.apk" "VardaDev-$V.apk" $PRE \
            --target "$GITHUB_SHA" \
            --title "Android app 1.${{ github.run_number }}${PRE:+ (${{ github.ref_name }})}" \
            --notes "Varda for Android head units: Varda.apk loads the app, VardaDev.apk the development version (both can be installed). Built from ${GITHUB_SHA::7}."
