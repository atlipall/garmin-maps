<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Photo location test</title>
<style>
  body { margin: 0; padding: 16px; font: 16px -apple-system, system-ui, sans-serif; color: #1b2230; background: #f4f5f7; }
  h1 { font-size: 22px; margin: 8px 0 4px; }
  p { color: #4b5466; margin: 4px 0 14px; }
  label { display: block; margin: 10px 0; padding: 14px; border-radius: 12px; background: #1d3f8f; color: #fff; font-weight: 700; text-align: center; }
  label.second { background: #fff; color: #1d3f8f; box-shadow: inset 0 0 0 1.5px #1d3f8f; }
  input { position: absolute; opacity: 0; width: 1px; }
  #out { display: grid; gap: 8px; margin-top: 14px; }
  .row { background: #fff; border-radius: 12px; padding: 10px 12px; font-size: 14px; }
  .yes { color: #1d6b3a; font-weight: 700; } .no { color: #b3261e; font-weight: 700; }
  #copy { margin-top: 12px; min-height: 44px; width: 100%; border: 0; border-radius: 12px; background: #e3e7ee; font-size: 16px; }
</style>
</head>
<body>
<h1>Do photos keep their location?</h1>
<p>Pick a few photos you know have a location (in Photos, swipe up on one to see its map). Try both buttons.</p>
<label>From Photos<input id="a" type="file" accept="image/*" multiple></label>
<label class="second">From Files (Browse)<input id="b" type="file" multiple></label>
<div id="out"></div>
<button id="copy" type="button" hidden>Copy the results</button>
<script>
// Finds "Exif\0\0" and reads the TIFF block after it: GPS, time, camera, orientation.
function exif(buf) {
  const u = new Uint8Array(buf);
  let at = -1;
  for (let i = 0; i < u.length - 6; i++) if (u[i] === 0x45 && u[i + 1] === 0x78 && u[i + 2] === 0x69 && u[i + 3] === 0x66 && u[i + 4] === 0 && u[i + 5] === 0 && ((u[i + 6] === 0x49 && u[i + 7] === 0x49) || (u[i + 6] === 0x4d && u[i + 7] === 0x4d))) { at = i + 6; break; }
  if (at < 0) return null;
  const v = new DataView(buf, at);
  const le = v.getUint16(0) === 0x4949;
  const u16 = (o) => v.getUint16(o, le), u32 = (o) => v.getUint32(o, le);
  const ifd = (o) => { const n = u16(o), t = {}; for (let i = 0; i < n; i++) { const e = o + 2 + i * 12; t[u16(e)] = { type: u16(e + 2), count: u32(e + 4), off: e + 8 }; } return t; };
  const val = (e) => {
    const size = { 1: 1, 2: 1, 3: 2, 4: 4, 5: 8, 7: 1, 9: 4, 10: 8 }[e.type] * e.count;
    const o = size > 4 ? u32(e.off) : e.off;
    if (e.type === 2) { let s = ''; for (let i = 0; i < e.count - 1; i++) s += String.fromCharCode(v.getUint8(o + i)); return s; }
    if (e.type === 3) return u16(o);
    if (e.type === 4) return u32(o);
    if (e.type === 5) return Array.from({ length: e.count }, (_, i) => u32(o + i * 8) / u32(o + i * 8 + 4));
    return null;
  };
  const r = {};
  const ifd0 = ifd(u32(4));
  if (ifd0[0x010f]) r.make = val(ifd0[0x010f]);
  if (ifd0[0x0110]) r.model = val(ifd0[0x0110]);
  if (ifd0[0x0112]) r.orientation = val(ifd0[0x0112]);
  if (ifd0[0x8769]) { const x = ifd(val(ifd0[0x8769])); if (x[0x9003]) r.taken = val(x[0x9003]); }
  if (ifd0[0x8825]) {
    const g = ifd(val(ifd0[0x8825]));
    if (g[2] && g[4]) {
      const dms = (a) => a[0] + a[1] / 60 + a[2] / 3600;
      const lat = dms(val(g[2])) * (val(g[1]) === 'S' ? -1 : 1), lon = dms(val(g[4])) * (val(g[3]) === 'W' ? -1 : 1);
      r.gps = lat.toFixed(5) + ', ' + lon.toFixed(5);
    } else r.gps = 'GPS block, but no position';
  }
  return r;
}
const lines = [navigator.userAgent];
async function show(files, how) {
  for (const f of files) {
    const buf = await f.arrayBuffer();
    let e = null; try { e = exif(buf); } catch (err) { e = { error: String(err) }; }
    let dims = 'not decodable';
    try { const bm = await createImageBitmap(f); dims = bm.width + ' × ' + bm.height; bm.close(); } catch {}
    const ok = e && e.gps && /^-?\d/.test(e.gps);
    const row = document.createElement('div');
    row.className = 'row';
    const text = `${how}: ${f.name} · ${f.type || '?'} · ${(f.size / 1e6).toFixed(2)} MB · ${dims}\n` +
      `location: ${ok ? e.gps : 'none'} · taken: ${e?.taken ?? '?'} · ${e?.make ?? ''} ${e?.model ?? ''} · orientation ${e?.orientation ?? '?'}${e ? '' : ' · no EXIF at all'}`;
    row.innerHTML = `<span class="${ok ? 'yes' : 'no'}">${ok ? 'Has location' : 'No location'}</span>`;
    row.append(document.createElement('br'), Object.assign(document.createElement('span'), { textContent: text }));
    row.style.whiteSpace = 'pre-wrap';
    document.getElementById('out').prepend(row);
    lines.push(text);
  }
  document.getElementById('copy').hidden = false;
}
document.getElementById('a').onchange = (ev) => show([...ev.target.files], 'Photos');
document.getElementById('b').onchange = (ev) => show([...ev.target.files], 'Files');
document.getElementById('copy').onclick = () => navigator.clipboard.writeText(lines.join('\n')).then(() => (document.getElementById('copy').textContent = 'Copied'));
</script>
</body>
</html>
