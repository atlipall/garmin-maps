<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#2c5a85" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <!-- Not black-translucent: iOS then gives the Home Screen app a view that is short by the status
         bar height (797 of 844 pt on an iPhone 13) and leaves an empty band below the map. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" href="./icons/icon-192.png" />
    <link rel="icon" href="./icons/icon-192.png" />
    <title>Garmin Map</title>
    <style>
      :root { --ink: #1d2a38; --paper: #f4f0e4; --accent: #2c5a85; }
      html, body { margin: 0; height: 100%; font: 15px -apple-system, system-ui, sans-serif; color: var(--ink); background: var(--paper); }
      /* The body is the positioning box for the map and every overlay. */
      body { position: fixed; top: 0; left: 0; right: 0; overflow: hidden; }
      #map { position: absolute; inset: 0; }
      .panel { background: #fffffff0; border-radius: 10px; box-shadow: 0 1px 6px #0003; }
      :root { --gap: 8px; --btn: 44px; --top: calc(env(safe-area-inset-top) + var(--gap)); --bottom: calc(env(safe-area-inset-bottom) + var(--gap)); }
      /* Top row: search (stretches) + menu button. */
      #topbar { position: absolute; z-index: 3; top: var(--top); left: calc(env(safe-area-inset-left) + var(--gap)); right: calc(env(safe-area-inset-right) + var(--btn) + 2 * var(--gap)); max-width: 420px; }
      .search-row { position: relative; }
      #search { width: 100%; height: var(--btn); box-sizing: border-box; padding: 0 var(--btn) 0 12px; font-size: 16px; border: 0; border-radius: 10px; background: transparent; }
      /* Our own clear button (iOS shows none); hide the browser's so desktop doesn't show two. */
      #search::-webkit-search-cancel-button { -webkit-appearance: none; appearance: none; display: none; }
      #search-clear { position: absolute; top: 0; right: 0; width: var(--btn); height: var(--btn); border: 0; background: none; font-size: 22px; line-height: 1; color: #667; cursor: pointer; -webkit-tap-highlight-color: transparent; }
      #results { list-style: none; margin: 0; padding: 0; max-height: 50vh; overflow: auto; }
      #results li { display: grid; grid-template-columns: 1fr auto; column-gap: 8px; padding: 8px 12px; border-top: 1px solid #0001; cursor: pointer; }
      #results .name { grid-column: 1; font-weight: 600; overflow-wrap: anywhere; }
      #results .detail { grid-column: 1; font-size: 13px; color: #667; }
      #results .dist { grid-column: 2; grid-row: 1 / span 2; align-self: center; font-size: 13px; color: #445; white-space: nowrap; }
      #menu-button { position: absolute; z-index: 3; top: var(--top); right: calc(env(safe-area-inset-right) + var(--gap)); width: var(--btn); height: var(--btn); border: 0; font-size: 22px; line-height: 1; color: var(--ink); cursor: pointer; -webkit-tap-highlight-color: transparent; }
      #menu { position: absolute; z-index: 4; background: #fff; top: calc(var(--top) + var(--btn) + 6px); right: calc(env(safe-area-inset-right) + var(--gap)); min-width: 200px; padding: 4px 0; }
      #menu button { display: block; width: 100%; padding: 12px 16px; border: 0; background: none; font-size: 16px; text-align: left; color: var(--ink); cursor: pointer; -webkit-tap-highlight-color: transparent; }
      #menu [role="menuitemcheckbox"] { display: flex; align-items: center; gap: 12px; justify-content: space-between; }
      #menu [role="menuitemcheckbox"]::after { content: ""; flex: none; width: 40px; height: 24px; border-radius: 12px; background: #c9ccd1 radial-gradient(circle at 12px 12px, #fff 9px, transparent 10px); transition: background-position 0.15s; }
      #menu [role="menuitemcheckbox"][aria-checked="true"]::after { background: #1f7ae0 radial-gradient(circle at 28px 12px, #fff 9px, transparent 10px); }
      #badge { position: absolute; z-index: 3; left: calc(env(safe-area-inset-left) + var(--gap)); bottom: calc(var(--bottom) + 64px); right: calc(env(safe-area-inset-right) + var(--btn) + 2 * var(--gap)); width: fit-content; padding: 6px 10px; font-size: 13px; color: #8a3b00; }
      #perf { position: absolute; z-index: 3; left: calc(env(safe-area-inset-left) + var(--gap)); top: calc(var(--top) + var(--btn) + var(--gap)); padding: 6px 8px; font: 11px ui-monospace, monospace; white-space: pre; }
      /* MapLibre's corner controls, kept clear of the notch / home indicator and our top row.
         '#map' raises specificity above maplibre-gl.css, which loads after this sheet. */
      #map .maplibregl-ctrl-top-right { top: calc(var(--top) + var(--btn)); right: env(safe-area-inset-right); }
      /* The home-indicator inset (34 pt) is generous; controls already have a 10 px margin, so
         sit ~30 pt above the screen edge, still clear of the indicator. */
      #map .maplibregl-ctrl-bottom-right { bottom: max(0px, calc(env(safe-area-inset-bottom) - 14px)); right: env(safe-area-inset-right); }
      #map .maplibregl-ctrl-bottom-left { bottom: max(0px, calc(env(safe-area-inset-bottom) - 14px)); left: env(safe-area-inset-left); }
      #map .maplibregl-ctrl-group { border-radius: 10px; box-shadow: 0 1px 6px #0003; }
      /* Your position: accuracy circle, direction cone (drawn pointing north, rotated by the marker), dot. */
      .you { width: 0; height: 0; }
      .you-accuracy { position: absolute; left: 0; top: 0; transform: translate(-50%, -50%); border-radius: 50%; background: #1f7ae01f; border: 1px solid #1f7ae055; pointer-events: none; }
      .you-cone { position: absolute; left: -40px; top: -80px; width: 80px; height: 80px; background: radial-gradient(circle at 50% 100%, #1f7ae0d9 0, #1f7ae066 45%, #1f7ae000 78%); clip-path: polygon(50% 100%, 12% 0, 88% 0); pointer-events: none; }
      .you-dot { position: absolute; left: -9px; top: -9px; width: 18px; height: 18px; box-sizing: border-box; border-radius: 50%; background: #1f7ae0; border: 3px solid #fff; box-shadow: 0 1px 4px #0005; }
      #map .locate-button { display: grid; place-items: center; color: var(--ink); border-radius: inherit; }
      #map .locate-button[data-state="north"], #map .locate-button[data-state="paused"] { color: #1f7ae0; }
      #map .locate-button[data-state="heading"] { color: #fff; background: #1f7ae0; }
      #map .locate-button.unavailable { opacity: 0.45; }
      #map .height-pill { padding: 3px 10px; border-radius: 999px; background: #fff; box-shadow: 0 1px 4px #0003; font: 600 13px/1.4 ui-monospace, "SF Mono", Menlo, monospace; color: var(--ink); }
      /* Finger-sized buttons on touch screens. */
      @media (pointer: coarse) {
        #map .maplibregl-ctrl-group button { width: var(--btn); height: var(--btn); }
        #map .maplibregl-ctrl-group button .maplibregl-ctrl-icon { background-size: 30px; }
      }
      /* Full-screen scroller; the card centres with margin:auto so a card taller than the visible
         area overflows downward (still scrollable) instead of being clipped at the top. */
      #import { position: fixed; inset: 0; z-index: 5; display: flex; box-sizing: border-box; overflow-y: auto; overscroll-behavior: contain; -webkit-overflow-scrolling: touch; background: var(--paper);
                padding: calc(env(safe-area-inset-top) + 16px) calc(env(safe-area-inset-right) + 16px) calc(env(safe-area-inset-bottom) + 16px) calc(env(safe-area-inset-left) + 16px); }
      #import .card { margin: auto; width: 100%; max-width: 440px; box-sizing: border-box; padding: 20px; }
      #import h2 { margin: 0 0 8px; }
      #import p { margin: 0 0 8px; }
      #import label { display: block; margin: 14px 0 4px; font-weight: 600; }
      #import input[type=file] { display: block; width: 100%; font-size: 16px; }
      #import .actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 18px; }
      #import button { padding: 10px 16px; font-size: 16px; border: 0; border-radius: 8px; background: var(--accent); color: white; }
      #import button:disabled { opacity: 0.6; }
      #import button.secondary { background: transparent; color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
      #import button.danger { background: transparent; color: #b00020; padding-left: 0; padding-right: 0; }
      #home-hint { font-size: 13px; color: #556; }
      #import-error { color: #b00020; white-space: pre-wrap; overflow-wrap: anywhere; margin-top: 12px; }
      #import-progress { margin-top: 12px; }
      @media (max-width: 400px), (max-height: 500px) { #import { padding-left: calc(env(safe-area-inset-left) + 8px); padding-right: calc(env(safe-area-inset-right) + 8px); } #import .card { padding: 16px; } #import label { margin-top: 10px; } }
      [hidden] { display: none !important; }
    </style>
  </head>
  <body>
    <div id="map"></div>
    <div id="topbar" class="panel" hidden>
      <div class="search-row">
        <input id="search" type="search" placeholder="Loading places…" aria-label="Search places" disabled autocomplete="off" enterkeyhint="search" />
        <button id="search-clear" type="button" aria-label="Clear search" hidden>×</button>
      </div>
      <ul id="results"></ul>
    </div>
    <div id="badge" class="panel" role="status" aria-live="polite" hidden></div>
    <button id="menu-button" class="panel" aria-label="Menu" aria-haspopup="true" aria-expanded="false" hidden>⋯</button>
    <div id="menu" class="panel" role="menu" hidden>
      <button id="keep-awake" role="menuitemcheckbox" aria-checked="true">Keep screen on while locating</button>
      <button id="replace" role="menuitem">Load another map</button>
    </div>
    <div id="perf" class="panel" hidden></div>
    <section id="import" hidden>
      <div class="card panel">
        <h2>Load your map</h2>
        <p>Pick the Garmin <code>.img</code> map file. Add the <code>.hgt</code> elevation files for hillshading (optional). They are stored on this device only.</p>
        <label for="img-file">Map (.img)</label>
        <input id="img-file" type="file" />
        <label for="hgt-files">Elevation (.hgt, select all)</label>
        <input id="hgt-files" type="file" multiple />
        <div class="actions"><button id="import-button">Import</button><button id="import-cancel" class="secondary" hidden>Cancel</button></div>
        <div id="import-progress"></div>
        <div id="import-error"></div>
        <p id="home-hint" hidden>Tip: add this app to your Home Screen first (Share → Add to Home Screen) so your map stays stored.</p>
        <div class="actions"><button id="remove-stored" class="danger" hidden>Remove stored map</button></div>
      </div>
    </section>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
