plugins {
    id "com.android.application"
}

// The release key comes from the environment (GitHub Actions secrets; see .github/workflows/android.yml).
def keystore = System.getenv("ANDROID_KEYSTORE_FILE")

android {
    namespace "is.atlipall.garminmap"
    compileSdk 36

    defaultConfig {
        applicationId "is.atlipall.garminmap"
        minSdk 24
        targetSdk 35
        versionCode Integer.parseInt(System.getenv("VERSION_CODE") ?: "1")
        versionName System.getenv("VERSION_NAME") ?: "dev"
    }

    // Two apps from one project: the app, and the development version (installable alongside it).
    flavorDimensions = ["site"]
    productFlavors {
        live {
            dimension "site"
            resValue "string", "app_name", "Garmin Map"
            resValue "string", "start_url", "https://atlipall.github.io/garmin-maps/app/"
            buildConfigField "String", "START_URL", "\"https://atlipall.github.io/garmin-maps/app/\""
        }
        dev {
            dimension "site"
            applicationIdSuffix ".dev"
            resValue "string", "app_name", "Map Dev"
            resValue "string", "start_url", "https://atlipall.github.io/garmin-maps/app-dev/"
            buildConfigField "String", "START_URL", "\"https://atlipall.github.io/garmin-maps/app-dev/\""
        }
    }

    buildFeatures {
        buildConfig true
    }

    signingConfigs {
        release {
            if (keystore) {
                storeFile file(keystore)
                storeType "pkcs12"
                storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
                keyAlias "garminmap"
                keyPassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig keystore ? signingConfigs.release : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Opens the app in Chrome as a Trusted Web Activity.
    implementation "com.google.androidbrowserhelper:androidbrowserhelper:2.7.3"
    // Location for the app in Chrome (LocationService).
    implementation "com.google.androidbrowserhelper:locationdelegation:1.1.2"
    // CustomTabsCallback, for logging what Chrome reports (ChromeLauncher).
    implementation "androidx.browser:browser:1.10.0"
}
